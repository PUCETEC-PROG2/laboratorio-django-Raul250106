{% extends 'base.html' %}
{% block content %}
  <p>
    Has elegido el pokemon: <strong>{{ pokemon|capfirst }}</strong>
  </p>
  <h3>Detalles:</h3>
  <ul>
    <li>Nombre: {{ pokemon.name }}</li>
    <li>Tipo: {{ pokemon.type }}</li>
    <li>Peso: {{ pokemon.weight }} kg</li>
    <li>Altura: {{ pokemon.height }} cm</li>
  </ul>
{% endblock %}
