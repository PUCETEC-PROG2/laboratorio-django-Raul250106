<html>
  <head>
    <title>Pokedex</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
  </head>
  {% extends 'base.html' %}
  {% block content %}
    <p class="p-2">
      <strong>Bienvenido a mi pokedex!</strong>
    </p>
    <h2 class="text-danger"><strong>Pokemons:</strong></h2>
    <div class="row">
      {% for pokemon in pokemons %}
        <div class="col-sm-12 col-md-6 col-lg-4">
          <a class="card" style="widht: 18rem;" href="{% url 'pokemon' pokemon.id %}">
            {% if pokemon.picture %}
              <img src="{{ pokemon.picture.url }}" class="card-img-top" alt="{{ pokemon.name }}" />
            {% endif %}
          </a>
          <div class="card-body">
            <p class="card-text"></p>
          </div>
        </div>
      {% endfor %}
    </div>

    <h2 class="text-danger"><strong>Entrenadores</strong></h2>
    <ul class="list-group">
      {% for trainer in trainers %}
        <li class="list-group-item">
          <a href="{% url 'entrenadores' trainer.id %}">{{ trainer.name|capfirst }}</a>
        </li>
      {% endfor %}
    </ul>
  {% endblock %}
</html>
