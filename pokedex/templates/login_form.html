{% extends 'base.html' %}
{% block title} {{ pokemon|capfirst }} {% endblock title}
{% block content %}
<form method="POST" class="m-4" style="font-family: 'Momo Trust Display', sans-serif; font-weight: 400; font-weight: bold;">
  {% csrf_token %}
  <div class="row d-flex justify-content-center">
    <div class="col-md-6">
      <div>
        <label for="username">Usuario</label>
        <input type="text" name="username" id="username" class="form-control">
      </div>

      <div>
        <label for="password">Contraseña</label>
        <input type="password" name="password" id="password" class="form-control">
      </div>

      <div class="m-4 text-center">
        <button type="submit" class="btn btn-success"
          style="font-family: 'Momo Trust Display', sans-serif; font-weight: 400; font-style: normal;">Ingresar</button>
          <a href="{% url 'pokedex:index' %}" class="btn btn-danger"
          style="font-family: 'Momo Trust Display', sans-serif; font-weight: 400; font-style: normal;">Salir</a>
      </div>

    </div>
  </div>
</form>
{% endblock %}
