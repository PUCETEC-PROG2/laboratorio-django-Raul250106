{% load static %}
<html>
  <head>
    <title>Pokedex</title>
    <link href="{% static 'bootstrap.min.css' %}" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css2?family=Momo+Trust+Display&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
  </head>
  <body>
    <div class="container" style="font-family: 'Momo Trust Display', sans-serif; font-weight: 400; font-style: normal;">
      <div class="bg-danger text-white p-3 text-center">
        <img src="{% static '11.png' %}" alt="" class="img-fluid" />
      </div>

      <nav class="navbar navbar-expand-lg navbar-dark bg-danger p-2">
        <div class="container-fluid">
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
          <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav text-white">
              <a href="{% url 'pokedex:index' %}" class="nav-link active">Pokemones</a>
              <a class="nav-link active" href="{% url 'pokedex:trainers' %}">Entrenadores</a>
            </div>

            <div class="ms-auto navbar-dark bg-danger">
              {% if not user.is_authenticated %}
                <form method="POST" action="{% url 'pokedex:login' %}">
                  {% csrf_token %}
                  <button class="nav-link active text-danger btn" style="border-radius: 1rem; background-color: white;">Iniciar sesión</button>
                </form>
              {% else %}
                <form method="POST" action="{% url 'logout' %}">
                  {% csrf_token %}
                  <button class="nav-link active text-danger btn" style="border-radius: 1rem; background-color: white;">Cerrar sesión</button>
                </form>
              {% endif %}
            </div>
          </div>
        </div>
      </nav>
      {% block content %}

      {% endblock %}
    </div>
  </body>
</html>
